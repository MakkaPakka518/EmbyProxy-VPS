name: 自动发版

on:
  workflow_dispatch:
    inputs:
      notes:
        description: '发布说明(留空自动从最近提交记录生成)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成版本号与发布说明
        id: meta
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -e
          VER=$(grep -oP 'VERSION:\s*\K[\d.]+' server.js | head -1)
          if [ -z "$VER" ]; then echo "未找到 server.js 中的 VERSION"; exit 1; fi
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > body.md
          else
            {
              echo "## v${VER}"
              echo
              git log --oneline -12 --no-merges
            } > body.md
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.meta.outputs.version }}" \
            --title "v${{ steps.meta.outputs.version }}" \
            --notes-file body.md \
            server.js panel.html install.sh
